<style>

:root[data-theme="dark"]{--bg:#0d1b4a;--pn:#1c2c66;--ink:#f2f5ff;--ln:#ffd200;--ac:#ffd200;--bt:#2a3f8f;--onac:#14204a;--btx:#ffffff;--pp:#1c2c66;--dim:#000000;--cur:#ffd93b;--pen:#ff7a70;--act:#3ee06a;--glow:#ffd200;--mapbg:#14245a;--grid:#000000;--mapt:#e8ecff;--flag:#ff4a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:10px}
h1{font-size:18px;margin:0 0 8px;text-align:center;letter-spacing:1px}.p{background:var(--pn);border:2px solid var(--ln);padding:8px;margin:8px 0;border-radius:4px}
button{font:inherit;color:var(--btx);background:var(--bt);border:2px solid var(--ln);border-radius:4px;padding:6px 9px;margin:2px;cursor:pointer}button.on{background:var(--ac);color:var(--onac)}button:disabled{opacity:.4}

.g{display:grid;gap:6px;width:100%;grid-template-columns:118px minmax(0,.72fr) minmax(0,2fr) minmax(0,.72fr) 118px;grid-template-areas:"i1 mp mp mp i2" "l1 l1 mc r1 r1" "l2 l2 mc r2 r2" "l3 l3 mc r3 r3" "sc sc sc sc sc";align-items:start}
.g>.mp,.g>.inf{align-self:stretch}.g>.p,.mc>.p{margin:0 0 6px}.mc{grid-area:mc}.sc{grid-area:sc}.inf{text-align:center;line-height:1.7}.sh td,.sh th{font-size:11px;padding:2px;height:18px}.sh td:first-child{font-weight:normal}.act{outline:3px solid var(--act)}.cur{background:color-mix(in srgb,var(--cur) 35%,transparent)}.chip{display:inline-block;width:12px;height:12px;border:1px solid #000;border-radius:50%;margin-right:5px}
@media (max-width:900px){.g{display:flex;flex-direction:column;align-items:stretch!important}.inf+.inf{display:none}.g>.inf br{display:none}.g>.inf{line-height:1.9;padding:6px 10px}.g>.inf .big,.g>.inf b{margin:0 3px}.g>.inf>b:first-child{display:none}:root .g>.inf .big{font-size:19px!important}}
.mg{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:4px}.ic{font-size:20px;filter:grayscale(1) opacity(.3)}.ic.lit{filter:drop-shadow(0 0 6px var(--glow))}.rs{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;padding:0;margin:0;border-width:0;transition:max-width .45s,opacity .45s,padding .45s}.rs.open{max-width:120px;opacity:1;padding:3px 9px;border-width:2px}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--dim) 35%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}.ov .p{max-width:360px;margin:0;background:var(--pp)}input[type=range]{width:160px}
.pn td{color:var(--pen);font-weight:bold}
.ov .hp{max-width:440px;border:4px double var(--ac);background:var(--pp);text-align:center}.hh{font-size:17px;font-weight:900;letter-spacing:1px;background:var(--ac);color:var(--onac);margin:-8px -8px 8px;padding:8px}.hg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.hg div{background:var(--bt);border:1px solid var(--ln);border-radius:4px;padding:4px}.hg span{display:block;font-size:11px;opacity:.75}.hs{margin:6px 0}

.ct1{display:inline-block;font:900 clamp(28px,8vw,72px)/1.1 ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 0 12px #ffd23f,0 4px 0 #b8860b,0 0 30px #ff9020;animation:cpop .8s cubic-bezier(.2,1.7,.4,1) both,cwob 1s .8s ease-in-out infinite alternate}

.fw{position:absolute;width:0;height:0}.fw i{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;opacity:0;animation:cfw 1.3s ease-out both}
#cel u{position:absolute;top:-16px;width:8px;height:14px;text-decoration:none;animation:cfall linear both}
@keyframes cpop{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}@keyframes cwob{from{transform:scale(1) rotate(-1.5deg)}to{transform:scale(1.06) rotate(1.5deg)}}@keyframes cfade{0%,85%{opacity:1}100%{opacity:0}}
@keyframes cfw{0%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}@keyframes cfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
.rp{max-width:380px;text-align:center}.hp .hg div b{font-size:13px}.rh{font-size:18px;font-weight:900;margin:8px 0}.rl{text-align:left;margin:6px 0;line-height:1.55}.rm{margin:2px 0 10px;padding:0;border:0;font-style:italic;background:none;font-size:1.05em}


.ov .sp{max-width:440px;max-height:88vh;overflow:auto;text-align:left;width:100%}.sr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px dotted var(--ln)}.sg{font-weight:bold;margin:10px 0 2px;text-transform:uppercase;font-size:12px;letter-spacing:1px}input[type=color]{width:54px;height:28px;padding:0;cursor:pointer}
.bd{position:absolute;left:0;animation:bfly linear both}.bd svg{display:block;overflow:visible;animation:bbob 1.1s ease-in-out infinite alternate}.wg{animation:bflap .3s ease-in-out infinite alternate}.b2 .wg{animation-duration:.45s}.b3 .wg{animation-duration:.8s}.wg.w2{animation-delay:-.15s}

.ov .fp{max-width:700px;max-height:94vh;overflow:auto}.tro{font-size:56px;line-height:1;animation:tbounce .9s ease-in-out infinite alternate;display:inline-block}@keyframes tbounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12px) rotate(6deg) scale(1.08)}}
.fc{font-size:12px;margin:8px 0}.fc td,.fc th{padding:3px 2px}.fc td:nth-child(2){text-align:left;font-weight:bold;white-space:nowrap}.fc tr.win{background:color-mix(in srgb,var(--ac) 22%,transparent)}.fc tr.par td{opacity:.75}

/* max power: three pulses of .8s */
.mpf{animation:mpflash3 .8s ease-out 3 both}
.mpb polyline{animation:mpbolt3 .8s ease-out 3 both}
.mpr{animation:mpring3 .8s ease-out 3 both}
.mpr.r2{animation:mpring3b .8s ease-out 3 both}
.mpk i{animation:mpspark3 .8s ease-out 3 both}
.mpa .avi{animation:mpbob .4s ease-in-out 6 alternate}
.mpt .mpx{animation:mpglow3 .8s ease-in-out 3}
.mpm i{animation:mpmeter .5s cubic-bezier(.3,.9,.4,1) forwards,mpmflash3 .8s ease-in-out 3}
.mpshake{animation:mpshake3 .8s linear 3}
@keyframes mpflash3{0%{opacity:0}7%{opacity:1}60%,100%{opacity:0}}
@keyframes mpbolt3{0%{stroke-dashoffset:160;opacity:1}32%{stroke-dashoffset:0;opacity:1}75%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes mpring3{0%{transform:scale(.2);opacity:1}80%,100%{transform:scale(28);opacity:0}}
@keyframes mpring3b{0%,22%{transform:scale(.2);opacity:0}24%{opacity:1}100%{transform:scale(24);opacity:0}}
@keyframes mpspark3{0%{transform:translate(0,0) rotate(45deg) scale(1.4);opacity:1}75%,100%{transform:translate(var(--dx),var(--dy)) rotate(225deg) scale(.3);opacity:0}}
@keyframes mpglow3{0%,100%{text-shadow:0 0 34px #ff9d00,0 7px 0 #3a1000;transform:none}30%{text-shadow:0 0 70px #ffea00,0 7px 0 #3a1000;transform:scale(1.07)}}
@keyframes mpmflash3{0%,100%{filter:none}25%{filter:brightness(1.7)}}
@keyframes mpshake3{0%,50%,100%{transform:none}10%{transform:translate(-9px,4px)}20%{transform:translate(8px,-5px)}30%{transform:translate(-6px,-3px)}40%{transform:translate(5px,5px)}}
.mpb polyline:nth-child(1){animation-delay:0s!important}.mpb polyline:nth-child(2){animation-delay:.03s!important}.mpb polyline:nth-child(3){animation-delay:.06s!important}.mpb polyline:nth-child(4){animation-delay:.09s!important}
.mpk i{animation-delay:0s!important}.mpk i:nth-child(3n){animation-delay:.05s!important}.mpk i:nth-child(3n+1){animation-delay:.1s!important}
.mpw.red *,.mpw.red::before{animation:none!important}

/* speed: while a pop-up covers the game, freeze the looping animations behind it (pulsing SELECT CLUB button, glowing player panel).
   The pop-up's backdrop blur had to be redrawn over the whole screen on every frame they changed, which made pop-ups lag badly. */
#app:has(.ov) *:not(.ov):not(.ov *),#app:has(.ov) *:not(.ov):not(.ov *)::before,#app:has(.ov) *:not(.ov):not(.ov *)::after{animation-play-state:paused!important}

/* speed: the club picker no longer uses see-through blur. Every hover inside it made the browser re-blur the whole screen
   behind the bag (once for the dark overlay, again for the panel, and again for each name tag), which caused the lag. */
#ckp,#ckp *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#ckp{background:rgba(8,14,30,.62)}
.ov .p *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#app:has(.ov) :not(.ov):not(.ov *){backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
/* clearer hover in the club picker */

/* ============ DIMPLED BALL ============
   Balls on the map are drawn as golf balls: dimples laid out on a sphere, light from the top left.
   While a putt rolls, the dimples turn with the ball in the direction it is travelling. */
function ballDraw(g,x,y,r,c,rot,dir){const pix=SK.s=='8'||SK.s=='16';g.save();

 // rows of dimples across the roll axis, each row a circle of the sphere turned by rot
 const rows=[-.72,-.36,0,.36,.72],st=.62;
 rows.forEach((v,ri)=>{const rr=Math.sqrt(1-v*v);for(let k=-6;k<=6;k++){const a=k*st+(ri%2?st/2:0)+rot,z=Math.cos(a)*rr;if(z<=.08)continue;
   const u=Math.sin(a)*rr,dx=(u*ux+v*vx)*r*.94,dy=(u*uy+v*vy)*r*.94,s=Math.max(.5,r*.15*(.35+.65*z));
   if(pix){g.fillStyle='rgba(0,0,0,'+(.14+.2*z).toFixed(2)+')';g.fillRect(Math.round(x+dx-.5),Math.round(y+dy-.5),1,1)}
   else{g.fillStyle='rgba(0,0,0,'+(.1+.22*z).toFixed(2)+')';g.beginPath();g.ellipse(x+dx,y+dy,s,s*(.55+.45*z),Math.atan2(dy,dx),0,7);g.fill();
    g.fillStyle='rgba(255,255,255,'+(.25*z).toFixed(2)+')';g.beginPath();g.arc(x+dx+s*.35,y+dy+s*.35,s*.45,0,7);g.fill()}}});
 // sphere shading: bright spot top left, darker rim bottom right
 const sh=g.createRadialGradient(x-r*.38,y-r*.42,r*.05,x,y,r*1.05);sh.addColorStop(0,'rgba(255,255,255,.75)');sh.addColorStop(.28,'rgba(255,255,255,.12)');sh.addColorStop(.75,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.38)');
 g.fillStyle=sh;g.fillRect(x-r,y-r,2*r,2*r);g.restore();
 g.beginPath();g.arc(x,y,r,0,7);g.strokeStyle='#000';g.lineWidth=1;g.stroke()}

<script>
{
const RB=[
['Quick start',`
<p><b>Table Top Golf</b> is a dice golf game for 1 to 6 players. Play 9 holes, and the <b>lowest total number of strokes wins</b>. Every course is par 36.</p>
<p>On every shot you pick a club, choose your aim and press SWING. The dice decide how far the ball flies and, on the longer clubs, how much it curves.</p>
<h3>Your first hole, step by step</h3>
<ol>
<li><b>Set up the players.</b> Type a name for each player and clear any slot you don't need. Tap the portrait to choose a golfer and pick a ball color. Each player needs a different name, golfer and color.</li>
<li><b>Pick a course</b> and press <b>Start Round</b>.</li>
<li><b>Read the Welcome card.</b> It shows the tee box and wind rolls, par, length, distance to the pin and which way to aim. Press OK.</li>
<li><b>Read your turn card:</b> your lie, the wind, your distance to the hole and how many squares up, down, left or right it is. Press OK.</li>
<li><b>Press SELECT CLUB.</b> Off the tee, take the <b>Driver</b> for the longest shot, or press Use suggested.</li>
<li><b>Set your aim</b> with − and + (or the slider), or press <b>Auto-aim</b> to point at the hole.</li>
<li><b>Tokens (optional):</b> tap a lit token to use it on this shot. Only one token per swing.</li>
<li><b>Press SWING!</b> A result card shows the roll and where the ball landed. Hate it? Press <b>Use mulligan</b> if you have one.</li>
<li><b>Press Continue.</b> Whoever is farthest from the hole plays next.</li>
</ol>
<div class="ex"><b>Example:</b> you are 23 squares from the hole. You take the Driver and Auto-aim says 2 up. The D20 rolls 14, so the ball flies 14 squares toward the hole. The curve dice roll 8, and 8 − 6 = +2, so it drifts 2 more squares up. You land 9 squares away.</div>
<p><b>Tip:</b> one square is 20 yards. The game always shows your distance to the hole.</p>`],
['Course & turns',`
<h3>The course</h3>
<table><tr><th>Ground</th><th>What it means</th></tr>
<tr><td>Tee box</td><td>Where everyone starts the hole.</td></tr>
<tr><td>Fairway</td><td>Short grass. A good place to hit from.</td></tr>
<tr><td>Rough</td><td>Long grass. Shots lose distance.</td></tr>
<tr><td>Sand trap</td><td>Shots lose more distance.</td></tr>
<tr><td>Green</td><td>Around the flag, where you putt.</td></tr>
<tr><td>Water, trees, brown ground</td><td>Hazards: see the Hazards tab.</td></tr></table>
<h3>Tee box roll (d4, before each hole)</h3>
<table><tr><th>Roll</th><th>Tees</th></tr>
<tr><td>1</td><td>Same tees as the last hole (Blues on hole 1)</td></tr>
<tr><td>2</td><td>Reds (forward, shortest)</td></tr>
<tr><td>3</td><td>Whites (middle)</td></tr>
<tr><td>4</td><td>Blues (back, longest)</td></tr></table>
<h3>Wind roll (two d4)</h3>
<p>Strength = first roll minus 1, so 0 to 3 (0 is calm). Direction = second roll: 1 North, 2 East, 3 South, 4 West. That is the way the ball gets blown: North pushes it up the map, East to the right.</p>
<h3>Whose turn is it?</h3>
<ul>
<li><b>On the tee:</b> hole 1 goes in setup order. After that, the best score on the last hole tees off first (\"the honors\").</li>
<li><b>After the tee shots:</b> the player <b>farthest from the hole</b> always goes next.</li>
<li><b>Ties:</b> the worse lie goes first (sand, rough, fairway, green), then honors order.</li>
<li><b>Water:</b> +1 penalty. The ball is moved back along your line to the nearest dry land, and you hit again from there.</li><li><b>Off the course:</b> take the penalty and hit again from where you were.</li>
</ul>`],
['Clubs & shots',`
<h3>The six clubs</h3>
<p>The four long clubs have a minimum distance (a lower roll counts as the minimum) and two curve dice.</p>
<table><tr><th>Club</th><th>Distance</th><th>Curve</th><th>Wind?</th></tr>
<tr><td>Driver</td><td>D20 · 10 to 20</td><td>2D6 − 6 (−4 to +6)</td><td>Yes · tee only</td></tr>
<tr><td>Wood</td><td>D12 · 6 to 12</td><td>2D6 − 6 (−4 to +6)</td><td>Yes</td></tr>
<tr><td>Long Iron</td><td>D10 · 5 to 10</td><td>2D4 − 4 (−2 to +4)</td><td>Yes</td></tr>
<tr><td>Short Iron</td><td>D8 · 4 to 8</td><td>2D4 − 4 (−2 to +4)</td><td>Yes</td></tr>
<tr><td>Wedge</td><td>D6 · 1 to 6</td><td>none</td><td>No</td></tr>
<tr><td>Putter</td><td>D4 · 1 to 4</td><td>none</td><td>No</td></tr></table>
<p>Distances are in squares. Rolling the top number with the Driver or a Wood sets off MAX POWER: great show, no extra distance.</p>
<h3>How the ball moves</h3>
<ol>
<li><b>Forward:</b> the full distance roll, straight toward the hole along the longer direction (up/down or left/right). A big roll can fly past the hole.</li>
<li><b>Sideways:</b> then it shifts by <b>aim + curve + wind</b>. Plus moves up or right; minus moves down or left.</li>
</ol>
<h3>Aim</h3>
